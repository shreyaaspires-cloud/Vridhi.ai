<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" width="180" height="44" fill="none">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB3" />
      <stop offset="45%" stop-color="#E5B25D" />
      <stop offset="85%" stop-color="#C68A2E" />
      <stop offset="100%" stop-color="#8B5B16" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49A38" />
      <stop offset="50%" stop-color="#FDE08B" />
      <stop offset="100%" stop-color="#C68A2E" />
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#F2DFB3" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#D49A38" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Golden Vridhi Ribbon/Wing Emblem -->
  <g transform="translate(4, 5)" filter="url(#goldGlow)">
    <!-- Left outer arm -->
    <path d="M 4 9 Q 12 25 19 33" stroke="url(#goldAccent)" stroke-width="4.8" stroke-linecap="round" fill="none" />
    <!-- Right main diagonal arm -->
    <path d="M 19 33 Q 27 19 35 7" stroke="url(#goldStem)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <!-- Inner upward swoosh / flourish -->
    <path d="M 8 27 C 14 21 23 12 30 10" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Center core glint -->
    <circle cx="20" cy="18" r="2.5" fill="#FFF2C6" />
  </g>

  <!-- Wordmark "Vridhi.ai" -->
  <text x="46" y="29"
    font-family="'Space Grotesk', Inter, system-ui, sans-serif"
    font-weight="700"
    font-size="22"
    fill="url(#textGold)"
    letter-spacing="-0.3">Vridhi<tspan fill="#E5B25D">.ai</tspan></text>
</svg>

