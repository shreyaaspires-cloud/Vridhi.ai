<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 42" width="170" height="42" fill="none">
  <!-- Vridhi.ai Growth V Emblem -->
  <g transform="translate(2, 4)">
    <!-- Left outer arm of V -->
    <path d="M 4 8 Q 12 24 19 32" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Right main arm of V -->
    <path d="M 19 32 Q 26 18 34 6" stroke="#1D4ED8" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <!-- Swooping inner leaf arc -->
    <path d="M 8 26 C 14 20 23 11 29 9" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Small leaf loop detail -->
    <path d="M 21 15 C 24 12 27 12 26 15 C 24 18 21 17 21 15 Z" fill="#93C5FD" opacity="0.9" />
  </g>
  <!-- Wordmark -->
  <text x="44" y="29"
    font-family="'Space Grotesk', Inter, system-ui, sans-serif"
    font-weight="700"
    font-size="22"
    fill="#EFF7FF"
    letter-spacing="-0.4">Vridhi<tspan fill="#38BDF8">.ai</tspan></text>
</svg>
