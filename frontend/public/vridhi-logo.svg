<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" width="180" height="44" fill="none">
  <defs>
    <!-- Forest Green & Emerald Gradients -->
    <linearGradient id="emeraldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#287657" />
      <stop offset="60%" stop-color="#163D32" />
      <stop offset="100%" stop-color="#102C25" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B49A63" />
      <stop offset="50%" stop-color="#D8C496" />
      <stop offset="100%" stop-color="#B49A63" />
    </linearGradient>
  </defs>

  <!-- Vridhi Growth Ribbon Emblem -->
  <g transform="translate(4, 5)">
    <!-- Left outer arm -->
    <path d="M 4 9 Q 12 25 19 33" stroke="url(#goldAccent)" stroke-width="4.8" stroke-linecap="round" fill="none" />
    <!-- Right main diagonal arm -->
    <path d="M 19 33 Q 27 19 35 7" stroke="url(#emeraldStem)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <!-- Inner upward swoosh / flourish -->
    <path d="M 8 27 C 14 21 23 12 30 10" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Center core glint -->
    <circle cx="20" cy="18" r="2.5" fill="#D8C496" />
  </g>

  <!-- Wordmark "Vridhi.ai" in Deep Forest Green + Emerald -->
  <text x="46" y="29"
    font-family="'Space Grotesk', Inter, system-ui, sans-serif"
    font-weight="700"
    font-size="22"
    fill="#163D32"
    letter-spacing="-0.3">Vridhi<tspan fill="#287657">.ai</tspan></text>
</svg>
